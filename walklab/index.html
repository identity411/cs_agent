<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>走图录制</title>
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="brand"><strong>走图录制</strong><select id="map-select" aria-label="选择地图"><option value="dust2">Dust2</option><option value="mirage">Mirage</option><option value="borgo">Borgo</option><option value="molo">Molo</option><option value="nevaio">Nevaio</option></select></div>
      <div class="setup-controls">
        <div class="side-control" role="group" aria-label="录制阵营"><button id="side-t" class="selected" type="button" aria-pressed="true">T</button><button id="side-ct" type="button" aria-pressed="false">CT</button></div>
        <select id="start-select" aria-label="选择录制起点"></select>
        <button id="pick-start" type="button">点选起点</button>
        <button id="use-position" type="button">当前位置</button>
        <input id="point-name" type="text" maxlength="40" placeholder="点位名称" aria-label="点位名称" />
        <button id="save-point" type="button">保存当前点位</button>
        <button id="edit-point" type="button" disabled>更新所选点位</button>
        <button id="delete-point" type="button" disabled>删除所选点位</button>
        <span id="point-status" role="status"></span>
      </div>
      <div class="commands">
        <div class="retake-control" role="group" aria-label="一键录制回防"><button id="retake-a-b" type="button">A → B 回防</button><button id="retake-b-a" type="button">B → A 回防</button></div>
        <label class="file-command">导入 GLB / glTF<input id="model-file" type="file" accept=".glb,.gltf" /></label>
        <button id="record" type="button">开始录制</button>
        <button id="rerecord" type="button">重新录制</button>
        <button id="play" type="button" disabled>回放</button>
        <button id="export" type="button" disabled>导出 JSON</button>
        <label class="file-command">导入记录<input id="recording-file" type="file" accept=".json" /></label>
      </div>
    </header>
    <main>
      <div id="viewport" aria-label="三维走图视图">
        <div class="crosshair" aria-hidden="true"></div>
        <div id="view-status" class="view-status">平台导航数据预览 · 无碰撞网格</div>
        <div id="click-prompt" class="click-prompt">移动鼠标转视角 · 双击锁定鼠标</div>
      </div>
      <aside class="inspector">
        <div class="section-title">当前状态</div>
        <dl>
          <dt>模式</dt><dd id="mode">待机</dd>
          <dt>地图</dt><dd id="map-id">-</dd>
          <dt>阵营</dt><dd id="side-label">T</dd>
          <dt>起点</dt><dd id="start-label">-</dd>
          <dt>用途</dt><dd id="purpose-label">普通路线</dd>
          <dt>位置</dt><dd id="position">-</dd>
          <dt>视角</dt><dd id="angles">-</dd>
          <dt>采样</dt><dd id="frames">0 帧</dd>
          <dt>输入</dt><dd id="inputs">-</dd>
        </dl>
        <div class="section-title">回放</div>
        <select id="pro-route-select" aria-label="职业 demo 轨迹"><option value="">选择职业 demo 轨迹</option></select>
        <select id="combo-select" aria-label="两段式组合"><option value="">选择两段式组合</option></select>
        <div id="combo-status" class="route-source"></div>
        <div class="route-actions"><input id="route-name" type="text" maxlength="80" placeholder="轨迹名称" aria-label="轨迹名称" /><button id="rename-route" type="button" disabled>重命名</button></div>
        <div id="route-source" class="route-source"></div>
        <input id="timeline" type="range" min="0" max="0" value="0" disabled />
        <div id="time" class="time">0.00 / 0.00 秒</div>
        <div class="section-title">路径</div>
        <div id="path-summary" class="path-summary">尚无记录</div>
        <div class="section-title">地图资源</div>
        <p id="asset-note">当前仅显示公开导航节点。导入对应版本的真实 3D 模型后可查看几何；位置移动仍需平台碰撞网格才能严格复现。</p>
      </aside>
    </main>
    <footer>W A S D 移动 · Space 跳跃 · 鼠标转视角 · 双击锁定鼠标 · Shift 加速 · Esc 退出锁定</footer>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
